<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>문의 | 두껍아 두껍아</title>
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.8/dist/web/static/pretendard.css">
  <link rel="stylesheet" href="./style.css?v=20260630-ui1">
  <link rel="stylesheet" href="./css/inquiry.css?v=20260630-ui1">
</head>
<body class="inquiry-page">
  <header class="header site-header-shell header-on-light" data-site-header data-current-page="inquiry"></header>
  <main class="inquiry-main inquiry-support-layout">
    <section class="inquiry-intro">
      <p>CUSTOMER SUPPORT</p>
      <h1>궁금한 점을<br>남겨주세요</h1>
      <p>문의 내용을 남겨주시면 확인 후 답변드립니다. 비회원 문의는 고객이 설정한 4자리 비밀번호로 조회할 수 있습니다.</p>
    </section>
    <form class="inquiry-card" data-inquiry-form>
      <fieldset data-inquiry-mode-fieldset>
        <legend>문의자 구분</legend>
        <div class="inquiry-choice">
          <label><input type="radio" name="checkoutMode" value="guest" checked><span>비회원 문의</span></label>
          <label><input type="radio" name="checkoutMode" value="member"><span>회원 문의</span></label>
        </div>
        <p class="member-inquiry-guide" data-member-login-prompt hidden>회원 문의는 로그인 후 4자리 비밀번호 없이 남길 수 있습니다. <a href="./auth.html">로그인하기</a></p>
        <p class="member-inquiry-guide" data-member-inquiry-ready hidden>로그인된 계정으로 회원 문의가 접수됩니다.</p>
      </fieldset>
      <div class="inquiry-grid" data-guest-fields>
        <label>이름<input name="name" required></label>
        <label>휴대전화<input name="phone" type="tel" required></label>
        <label class="full">이메일<input name="email" type="email" required></label>
      </div>
      <label>문의 유형
        <select name="type" required>
          <option value="service">서비스</option>
          <option value="estimate_booking">견적·예약</option>
          <option value="payment_refund">결제·환불</option>
          <option value="schedule_change">일정 변경</option>
          <option value="work_as">작업 후 A/S</option>
          <option value="account">회원정보</option>
          <option value="other">기타</option>
        </select>
      </label>
      <label>제목<input name="title" maxlength="100" required></label>
      <label>내용<textarea name="content" rows="8" maxlength="5000" required></textarea></label>
      <label data-pin-field>4자리 비밀번호
        <input name="pin" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" autocomplete="off" required>
        <small>문의 조회 시 필요하며 원문은 저장하지 않습니다.</small>
      </label>
      <label class="inquiry-consent"><input type="checkbox" name="consent" value="yes" required>개인정보 수집·이용에 동의합니다.</label>
      <p data-inquiry-status aria-live="polite"></p>
      <button class="btn-primary" type="submit" data-inquiry-submit>문의 접수</button>
    </form>
  </main>
  <script src="./js/config.js?v=20260623-live1"></script>
  <script type="module" src="./js/site/site-header.js?v=20260630-ui1"></script>
  <script type="module" src="./js/pages/home-account.js?v=20260630-auth1"></script>
  <script type="module" src="./js/pages/inquiry-page.js?v=20260623-copy1"></script>
</body>
</html>
